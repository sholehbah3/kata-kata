<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial Untukmu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            animation: fadeIn 0.8s ease-in-out;
            color: #ffffff;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 22px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            color: #f1f1f1;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        input[type="password"] {
            width: 80%;
            padding: 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
        }

        .btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        .error-text {
            color: #ffdddd;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efek Hati Berjatuhan */
        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Layar Kunci / Password -->
    <div class="card" id="cardContent">
        <div class="avatar">🔒</div>
        <h2>Pesan Ini Dikunci</h2>
        <p>Masukkan kata sandi untuk membuka pesan khusus ini:</p>
        <input type="password" id="passInput" placeholder="Masukkan Password">
        <br>
        <button class="btn" onclick="checkPassword()">Buka Pesan 🔑</button>
        <p class="error-text" id="errorMsg">Password salah! Coba lagi ya 😉</p>
    </div>

    <script>
        let step = 1;

        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (pass === "1234") {
                nextStep();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function nextStep() {
            const card = document.getElementById('cardContent');
            
            if (step === 1) {
                // Halaman Pertama setelah berhasil memasukkan password
                card.innerHTML = `
                    <div class="avatar">🐼</div>
                    <h2>Kamu Tau Ngga? 🤔</h2>
                    <p>Siapa yang bisa gantiin kamu di hidupku? 🧐<br><br><small style="color: #fff; font-weight: bold; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 10px;">(Coba baca teks berwarna hitam di bawah ini)</small></p>
                    <button class="btn" onclick="nextStep()">Lanjut ✨</button>
                `;
                step++;
            } else if (step === 2) {
                // Pesan kedua
                card.innerHTML = `
                    <div class="avatar">🐨</div>
                    <h2>Kenapa Bingung?! 😆</h2>
                    <p>Ga ada teks warna hitam kan? 🤣<br><br>Yaudah, itu artinya <b>ga bakal ada siapapun yang bisa gantiin kamu di hidupku!</b> 👀💖</p>
                    <button class="btn" onclick="nextStep()">Ada Lagi 💌</button>
                `;
                step++;
            } else if (step === 3) {
                // Pesan ketiga (Tambahan Teks Lebih Banyak)
                card.innerHTML = `
                    <div class="avatar">✨</div>
                    <h2>Terima Kasih Ya!</h2>
                    <p>Makasih udah hadir dan mewarnai hari-hariku. Semoga hari-harimu selalu bahagia, dan jangan lupa tersenyum hari ini! 😊</p>
                    <button class="btn" onclick="nextStep()">Pesan Terakhir 🌹</button>
                `;
                step++;
            } else if (step === 4) {
                // Halaman Akhir dengan Efek Hati
                card.innerHTML = `
                    <div class="avatar">💖</div>
                    <h2>I Love You So Much! 🥰</h2>
                    <p>You are special, today, tomorrow, and always! &lt;3</p>
                    <button class="btn" onclick="location.reload()">Ulangi dari Awal 🌸</button>
                `;
                createHearts();
            }
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);

                setTimeout(() => { heart.remove(); }, 5000);
            }, 250);
        }
    </script>

</body>
</html>
